# The YAML form: one file, carrying the reason and an expiry alongside each id.
# Used by the `trivyignore-yaml` scenario against tests/fixtures/vulnerable,
# which fails the scan without it.
#
# Every fixable HIGH and CRITICAL in the fixture has to be listed, not just the
# CRITICAL the fixture exists for. The scenario used to narrow the scan to
# CRITICAL; HIGH,CRITICAL is a floor now and `extra-scan-severity` cannot go
# below it, so an unlisted HIGH fails the scenario. Re-check this list when
# lodash gains a new fixable finding - tests/README.md has the command.
vulnerabilities:
  - id: CVE-2019-10744
    statement: >-
      Test fixture. This finding exists on purpose, so that the scenario
      exercising `trivyignores` has something real to suppress.
    # Far out deliberately: this acceptance is a fixture, not a decision anyone
    # should be asked to revisit.
    expired_at: 2099-01-01
  - id: CVE-2020-8203
    statement: >-
      Test fixture. Not what the scenario is about - suppressed only because
      the scan can no longer be narrowed past HIGH.
    expired_at: 2099-01-01
  - id: CVE-2021-23337
    statement: >-
      Test fixture. Not what the scenario is about - suppressed only because
      the scan can no longer be narrowed past HIGH.
    expired_at: 2099-01-01
  - id: CVE-2026-4800
    statement: >-
      Test fixture. Not what the scenario is about - suppressed only because
      the scan can no longer be narrowed past HIGH.
    expired_at: 2099-01-01
