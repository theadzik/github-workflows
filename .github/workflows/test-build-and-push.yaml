name: Test build-and-push

# Calls build-and-push.yaml the way a caller does, once per scenario.
# `uses: ./` runs the copy on the pull request. See tests/README.md.
on:
  pull_request:
    paths:
      - ".github/workflows/build-and-push.yaml"
      - ".github/workflows/test-build-and-push.yaml"
      - "tests/**"
  # For a branch the paths miss, and for a fork's pull request.
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  # A called workflow's `with:` can read only `needs` and `github`, so every
  # shared constant has to be a job output.
  shared:
    name: Shared values
    runs-on: ubuntu-latest
    outputs:
      image: theadzik/github-workflows-test
      head-sha: ${{ github.event.pull_request.head.sha || github.sha }}

      # False only for a fork's pull request, which cannot grant
      # `id-token: write`. Dependabot can, so it is not excluded.
      can-run: ${{ github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository }}
    steps:
      - name: Report whether the scenarios can run
        env:
          CAN_RUN: ${{ github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository }}
        run: |-
          set -euo pipefail
          if [[ "${CAN_RUN}" == "true" ]]; then
            echo "Calling scenarios will run." >> "$GITHUB_STEP_SUMMARY"
          else
            {
              echo "### Calling scenarios skipped"
              echo
              echo "This event cannot grant \`id-token: write\`, which build-and-push.yaml"
              echo "requires. Re-run this workflow manually against the branch to test it."
            } >> "$GITHUB_STEP_SUMMARY"
          fi

  # The scenarios. Only paths a green run can prove; see tests/README.md.

  # Required inputs only. The whole publishing chain runs.
  defaults:
    name: Defaults, full publish
    needs: shared
    if: needs.shared.outputs.can-run == 'true'
    permissions:
      contents: read
      id-token: write
      attestations: write
      artifact-metadata: write
      packages: write
    uses: ./.github/workflows/build-and-push.yaml
    with:
      registry: ghcr.io
      image-name: ${{ needs.shared.outputs.image }}
      registry-username: ${{ github.actor }}
      context-path: tests/fixtures/clean
    secrets:
      REGISTRY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}

  # A caller's own pull request: build and scan, publish nothing. The severity
  # value is lowercase and spaced on purpose - it tests the parser.
  build-only:
    name: push false, build and scan only
    needs: shared
    if: needs.shared.outputs.can-run == 'true'
    permissions:
      contents: read
      id-token: write
      attestations: write
      artifact-metadata: write
      packages: write
    uses: ./.github/workflows/build-and-push.yaml
    with:
      registry: ghcr.io
      image-name: ${{ needs.shared.outputs.image }}
      registry-username: ${{ github.actor }}
      context-path: tests/fixtures/clean
      push: false
      extra-scan-severity: "medium, low"
      timeout-minutes: 15
      tags: |
        type=raw,value=never-published-${{ github.run_id }}
        type=sha
    secrets:
      REGISTRY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}

  # The fixture's Dockerfile fails the build if the args do not arrive.
  # The extra registry is ghcr.io again: the login step is what is under test.
  every-optional-input:
    name: Build args, tags, ref, extra registry
    needs: shared
    if: needs.shared.outputs.can-run == 'true'
    permissions:
      contents: read
      id-token: write
      attestations: write
      artifact-metadata: write
      packages: write
    uses: ./.github/workflows/build-and-push.yaml
    with:
      registry: ghcr.io
      image-name: ${{ needs.shared.outputs.image }}
      registry-username: ${{ github.actor }}
      context-path: tests/fixtures/build-args
      git-ref: ${{ needs.shared.outputs.head-sha }}
      fetch-depth: 0
      build-args: |
        EXPECTED=passed-through
        SECOND_ARG=also-passed
      tags: |
        type=raw,value=build-args-${{ github.run_id }}
        type=raw,value=build-args-${{ github.run_id }}-second
        type=sha
      extra-registry: ghcr.io
      extra-registry-username: ${{ github.actor }}
    secrets:
      REGISTRY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
      EXTRA_REGISTRY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}

  # One non-default platform - the case syft gets wrong on its own.
  arm64:
    name: linux/arm64 only
    needs: shared
    if: needs.shared.outputs.can-run == 'true'
    permissions:
      contents: read
      id-token: write
      attestations: write
      artifact-metadata: write
      packages: write
    uses: ./.github/workflows/build-and-push.yaml
    with:
      registry: ghcr.io
      image-name: ${{ needs.shared.outputs.image }}
      registry-username: ${{ github.actor }}
      context-path: tests/fixtures/cross
      platforms: "linux/arm64"
      tags: type=raw,value=arm64-${{ github.run_id }}
    secrets:
      REGISTRY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}

  # An index, not a manifest: the coverage warning fires and syft describes
  # the first platform only.
  multi-platform:
    name: Multi-platform index
    needs: shared
    if: needs.shared.outputs.can-run == 'true'
    permissions:
      contents: read
      id-token: write
      attestations: write
      artifact-metadata: write
      packages: write
    uses: ./.github/workflows/build-and-push.yaml
    with:
      registry: ghcr.io
      image-name: ${{ needs.shared.outputs.image }}
      registry-username: ${{ github.actor }}
      context-path: tests/fixtures/cross
      platforms: "linux/amd64,linux/arm64"
      tags: type=raw,value=multiarch-${{ github.run_id }}
    secrets:
      REGISTRY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}

  # `scan: false` only works with `push: false`, so this fixture is built and
  # never published.
  scan-disabled:
    name: scan false
    needs: shared
    if: needs.shared.outputs.can-run == 'true'
    permissions:
      contents: read
      id-token: write
      attestations: write
      artifact-metadata: write
      packages: write
    uses: ./.github/workflows/build-and-push.yaml
    with:
      registry: ghcr.io
      image-name: ${{ needs.shared.outputs.image }}
      registry-username: ${{ github.actor }}
      context-path: tests/fixtures/vulnerable
      scan: false
      push: false
    secrets:
      REGISTRY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}

  # The YAML ignore form. `push: false` with `scan` defaulted scans without
  # publishing, so the ignore file is read. See tests/README.md.
  trivyignore-yaml:
    name: trivyignores, YAML form
    needs: shared
    if: needs.shared.outputs.can-run == 'true'
    permissions:
      contents: read
      id-token: write
      attestations: write
      artifact-metadata: write
      packages: write
    uses: ./.github/workflows/build-and-push.yaml
    with:
      registry: ghcr.io
      image-name: ${{ needs.shared.outputs.image }}
      registry-username: ${{ github.actor }}
      context-path: tests/fixtures/vulnerable
      trivyignores: tests/trivyignore/accepted.trivyignore.yaml
      push: false
    secrets:
      REGISTRY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}

  # The plain form. The file that suppresses anything is listed second.
  trivyignore-plain:
    name: trivyignores, plain form, two files
    needs: shared
    if: needs.shared.outputs.can-run == 'true'
    permissions:
      contents: read
      id-token: write
      attestations: write
      artifact-metadata: write
      packages: write
    uses: ./.github/workflows/build-and-push.yaml
    with:
      registry: ghcr.io
      image-name: ${{ needs.shared.outputs.image }}
      registry-username: ${{ github.actor }}
      context-path: tests/fixtures/vulnerable
      trivyignores: tests/trivyignore/decoy.trivyignore,tests/trivyignore/accepted.trivyignore
      push: false
    secrets:
      REGISTRY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}

  # What the `defaults` scenario left in the registry, checked from outside.
  # Also the only test of the workflow's outputs.
  published:
    name: Verify what was published
    needs: [shared, defaults]
    if: needs.shared.outputs.can-run == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - name: Login to ghcr.io
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.1.2

      - name: Install oras
        uses: oras-project/setup-oras@1d808f7d7f6995cc68b7bf507bfe5c5446e1dc9d # v2.0.1

      - name: The outputs describe a real image
        env:
          DIGEST: ${{ needs.defaults.outputs.digest }}
          IMAGE_REF: ${{ needs.defaults.outputs.image-ref }}
          EXPECTED_REF: ghcr.io/${{ needs.shared.outputs.image }}
        run: |-
          set -euo pipefail
          if [[ ! "${DIGEST}" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "::error title=Outputs::digest output is '${DIGEST}'"
            exit 1
          fi
          if [[ "${IMAGE_REF}" != "${EXPECTED_REF}" ]]; then
            echo "::error title=Outputs::image-ref output is '${IMAGE_REF}', expected '${EXPECTED_REF}'"
            exit 1
          fi
          echo "Outputs: ${IMAGE_REF}@${DIGEST}"

      - name: The image carries the signature the cluster expects
        env:
          DIGEST: ${{ needs.defaults.outputs.digest }}
          IMAGE_REF: ${{ needs.defaults.outputs.image-ref }}
          SIGNER_IDENTITY: '^https://github\.com/theadzik/github-workflows/\.github/workflows/build-and-push\.yaml@.+$'
        run: |-
          set -euo pipefail
          cosign verify \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            --certificate-identity-regexp "${SIGNER_IDENTITY}" \
            "${IMAGE_REF}@${DIGEST}" > /dev/null
          echo "Signature verified from outside the build."

      - name: Both attestations are attached to that digest
        env:
          DIGEST: ${{ needs.defaults.outputs.digest }}
          IMAGE_REF: ${{ needs.defaults.outputs.image-ref }}
        run: |-
          set -euo pipefail
          oras discover --format json "${IMAGE_REF}@${DIGEST}" > referrers.json
          # `referrers` since oras 1.2, `manifests` before it.
          jq -r '(.referrers // .manifests // [])[] | "\(.artifactType)\t\(.digest)"' referrers.json
          count=$(jq '(.referrers // .manifests // []) | length' referrers.json)
          # One cosign signature, plus the SBOM and provenance bundles.
          if [[ "${count}" -lt 3 ]]; then
            echo "::error title=Referrers::expected at least 3 referrers, found ${count}"
            exit 1
          fi

      - name: The published tag resolves to that digest
        env:
          DIGEST: ${{ needs.defaults.outputs.digest }}
          IMAGE_REF: ${{ needs.defaults.outputs.image-ref }}
        run: |-
          set -euo pipefail
          # `latest` because the `defaults` scenario takes the default tag spec.
          tagged=$(docker buildx imagetools inspect "${IMAGE_REF}:latest" --format '{{ .Manifest.Digest }}')
          if [[ "${tagged}" != "${DIGEST}" ]]; then
            echo "::error title=Tags::latest points at ${tagged}, the build reported ${DIGEST}"
            exit 1
          fi
          echo "latest -> ${DIGEST}"

  # Deletes this run's throwaway images. Runs even when a scenario failed,
  # because a build that died after pushing still left tags behind.
  cleanup:
    name: Delete this run's images
    needs: [shared, defaults, every-optional-input, arm64, multi-platform, published]
    if: always() && needs.shared.outputs.can-run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      packages: write
    steps:
      - name: Delete the package versions this run created
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IMAGE: ${{ needs.shared.outputs.image }}
          RUN_ID: ${{ github.run_id }}
        run: |-
          set -euo pipefail

          # Split from the one string the scenarios published to. A second copy
          # could drift, and this job deletes things.
          OWNER="${IMAGE%%/*}"
          PACKAGE="${IMAGE#*/}"
          if [[ "${OWNER}" == "${IMAGE}" || -z "${PACKAGE}" ]]; then
            echo "::error title=Cleanup::cannot split '${IMAGE}' into an owner and a package name"
            exit 1
          fi
          # The REST API wants a nested path encoded; the registry API does not.
          PACKAGE_PATH="${PACKAGE//\//%2F}"

          # gh prints the error body to stdout, so an unchecked failure would
          # read as "nothing to delete" when it is really a permission problem.
          if ! versions=$(gh api --paginate "/users/${OWNER}/packages/container/${PACKAGE_PATH}/versions" 2>"${RUNNER_TEMP}/gh-error"); then
            if grep -q '(HTTP 404)' "${RUNNER_TEMP}/gh-error"; then
              echo "No ${PACKAGE} package in ghcr.io; nothing to delete"
              exit 0
            fi
            cat "${RUNNER_TEMP}/gh-error" >&2
            echo "::error title=Cleanup::could not list versions of ${PACKAGE}"
            exit 1
          fi

          id_of() { jq -r --arg d "$1" 'map(select(.name == $d)) | first | .id // empty' <<< "${versions}"; }

          # Signature and attestations are separate untagged versions. Resolve
          # them while the manifest they hang off still exists. Best effort.
          ghcr_token=$(curl -fsSL -u "${OWNER}:${GH_TOKEN}" \
            "https://ghcr.io/token?service=ghcr.io&scope=repository:${OWNER}/${PACKAGE}:pull" \
            | jq -er .token) || ghcr_token=""
          referrers_of() {
            [[ -n "${ghcr_token}" ]] || return 0
            curl -fsSL -H "Authorization: Bearer ${ghcr_token}" \
              "https://ghcr.io/v2/${OWNER}/${PACKAGE}/referrers/$1" 2>/dev/null \
              | jq -r '.manifests[]?.digest' || true
          }

          # `latest` is kept: a package deleted down to nothing loses the
          # Actions access grant that lets this job delete anything.
          keep=()
          latest=$(jq -r 'map(select((.metadata.container.tags // []) | index("latest"))) | first | .name // empty' <<< "${versions}")
          if [[ -n "${latest}" ]]; then
            keep+=("$(id_of "${latest}")")
            for referrer in $(referrers_of "${latest}"); do
              keep+=("$(id_of "${referrer}")")
            done
          fi

          # Every tag this run published carries its run id, so a concurrent
          # run on another branch is never in scope.
          doomed=()
          for digest in $(jq -r --arg run "${RUN_ID}" \
            '.[] | select((.metadata.container.tags // []) | any(test("-" + $run + "(-|$)"))) | .name' <<< "${versions}"); do
            doomed+=("$(id_of "${digest}")")
            for referrer in $(referrers_of "${digest}"); do
              doomed+=("$(id_of "${referrer}")")
            done
          done

          # Orphans from a run that died mid-way, once no run can still want them.
          cutoff=$(date -u -d '6 hours ago' +%Y-%m-%dT%H:%M:%SZ)
          while read -r id; do
            [[ -n "${id}" ]] && doomed+=("${id}")
          done < <(jq -r --arg cutoff "${cutoff}" \
            '.[] | select(((.metadata.container.tags // []) | length) == 0) | select(.updated_at < $cutoff) | .id' <<< "${versions}")

          failed=0
          deleted=0
          for id in $(printf '%s\n' "${doomed[@]}" | grep -E '^[0-9]+$' | sort -u); do
            skip=""
            for kept in "${keep[@]}"; do
              [[ "${id}" == "${kept}" ]] && skip=yes
            done
            [[ -n "${skip}" ]] && continue

            if gh api -X DELETE "/users/${OWNER}/packages/container/${PACKAGE_PATH}/versions/${id}" --silent; then
              deleted=$((deleted + 1))
            else
              failed=1
            fi
          done

          echo "Deleted ${deleted} version(s) of ${PACKAGE}; kept latest and its referrers."
          if [[ "${failed}" -ne 0 ]]; then
            echo "::error title=Cleanup::GITHUB_TOKEN can only delete versions of a package that grants this repository the Admin role under Package settings > Manage Actions access."
            exit 1
          fi

  # One check to require on the branch.
  result:
    name: Test result
    if: always()
    needs:
      - shared
      - defaults
      - build-only
      - every-optional-input
      - arm64
      - multi-platform
      - scan-disabled
      - trivyignore-yaml
      - trivyignore-plain
      - published
      - cleanup
    runs-on: ubuntu-latest
    steps:
      - name: Collect
        env:
          RESULTS: ${{ toJSON(needs) }}
          CAN_RUN: ${{ needs.shared.outputs.can-run }}
        run: |-
          set -euo pipefail
          jq -r 'to_entries[] | "\(.value.result)\t\(.key)"' <<< "$RESULTS" | sort

          # Nothing ran, so say so. A green check here means "not tested".
          if [[ "${CAN_RUN}" != "true" ]]; then
            echo "::warning title=Tests::nothing ran - this event cannot grant id-token: write. Re-run manually against the branch."
            exit 0
          fi

          # Every job was meant to run, so skipped and cancelled are failures too.
          if jq -e 'to_entries | any(.value.result != "success")' <<< "$RESULTS" > /dev/null; then
            echo "::error title=Tests::at least one scenario did not succeed"
            exit 1
          fi
