name: Build and Push Docker Image

# Shared reusable workflow. Callers:
#   uses: theadzik/github-workflows/.github/workflows/build-and-push.yaml@<sha>
#   secrets: inherit   # supplies DOCKERHUB_TOKEN
on:
  workflow_call:
    inputs:
      image-name:
        description: "Image repository name, appended to <registry>/<username>/."
        required: true
        type: string
      context-path:
        description: "Docker build context."
        required: false
        type: string
        default: "."
      git-ref:
        description: "Ref to check out. Empty means the ref that triggered the run."
        required: false
        type: string
        default: ""
      fetch-depth:
        description: "Checkout depth. 0 for full history (needed when the build reads .git)."
        required: false
        type: number
        default: 1
      tags:
        description: "docker/metadata-action tag spec, one per line."
        required: false
        type: string
        default: "type=raw,value=latest"
      build-args:
        description: "Docker build args, one KEY=value per line."
        required: false
        type: string
        default: ""
      platforms:
        description: "Single platform only - the pre-push scan loads the image locally."
        required: false
        type: string
        default: "linux/amd64"
      push:
        description: "Push and attest. False builds and scans only (pull requests)."
        required: false
        type: boolean
        default: true
      scan:
        description: "Fail the build on fixable HIGH/CRITICAL findings before anything is published."
        required: false
        type: boolean
        default: true
      scan-severity:
        required: false
        type: string
        default: "HIGH,CRITICAL"
      registry:
        required: false
        type: string
        default: "docker.io"
      registry-username:
        description: "Defaults to the caller repository's DOCKERHUB_USERNAME variable."
        required: false
        type: string
        default: ""
      extra-registry:
        description: "Second registry to authenticate against with the same credentials. Empty to skip."
        required: false
        type: string
        default: "dhi.io"
      timeout-minutes:
        required: false
        type: number
        default: 30
    secrets:
      DOCKERHUB_TOKEN:
        required: true
    outputs:
      digest:
        description: "Digest of the image that was scanned, signed and tagged."
        value: ${{ jobs.build-push-sign.outputs.digest }}
      image-ref:
        description: "Image reference without a tag, for example docker.io/user/name."
        value: ${{ jobs.build-push-sign.outputs.image-ref }}

env:
  REGISTRY: ${{ inputs.registry }}
  REPOSITORY: ${{ inputs.registry-username != '' && inputs.registry-username || vars.DOCKERHUB_USERNAME }}
  IMAGE_NAME: ${{ inputs.image-name }}

jobs:
  build-push-sign:
    permissions:
      contents: read
      id-token: write
      attestations: write
      artifact-metadata: write
    runs-on: ubuntu-latest
    timeout-minutes: ${{ inputs.timeout-minutes }}
    outputs:
      digest: ${{ steps.build-push.outputs.digest }}
      image-ref: ${{ env.REGISTRY }}/${{ env.REPOSITORY }}/${{ env.IMAGE_NAME }}
    steps:
      # Two reasons: the build-only path exports to the local docker daemon,
      # which cannot hold more than one platform, and Trivy scans a single
      # platform out of a multi-platform index, so the scan would cover less
      # than what gets signed.
      - name: Reject multi-platform input
        if: contains(inputs.platforms, ',')
        run: |
          echo "::error title=platforms::multi-platform builds are unsupported; the scan would not cover every platform that gets signed"
          exit 1

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.git-ref }}
          fetch-depth: ${{ inputs.fetch-depth }}
          # Otherwise checkout writes an x-access-token auth header into
          # .git/config. A `COPY .` would bake that token into a builder layer,
          # and `cache-to: type=gha,mode=max` would export it to the Actions
          # cache, where it outlives the job. Nothing here pushes via git.
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      # Both logins run even on build-only pull requests: authenticated pulls
      # lift the anonymous Docker Hub rate limit, and dhi.io issues no
      # anonymous pull tokens at all. One Docker account backs both.
      - name: Login to registry
        uses: docker/login-action@abd2ef45e78c5afb21d64d4ca52ee8550d9572c7 # v4.5.1
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ env.REPOSITORY }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Login to extra registry
        if: inputs.extra-registry != ''
        uses: docker/login-action@abd2ef45e78c5afb21d64d4ca52ee8550d9572c7 # v4.5.1
        with:
          registry: ${{ inputs.extra-registry }}
          username: ${{ env.REPOSITORY }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.REPOSITORY }}/${{ env.IMAGE_NAME }}
          tags: ${{ inputs.tags }}

      # One build, one artifact. An earlier version built the image locally to
      # scan it and then built it again to push, which meant the bytes Trivy
      # cleared were only presumed identical to the bytes that got signed: a
      # cache miss, or a base image whose tag moved between the two builds,
      # would silently break that assumption.
      #
      # When publishing, the exporter pushes by digest with no tags, so the
      # image is not yet discoverable - ArgoCD Image Updater finds images by
      # listing tags - and every gate below runs against that exact digest
      # before any tag exists. When not publishing, the same build is exported
      # to the local docker daemon and scanned there.
      - name: Build image
        id: build-push
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: ${{ inputs.context-path }}
          platforms: ${{ inputs.platforms }}
          outputs: ${{ inputs.push && format('type=image,name={0}/{1}/{2},push-by-digest=true,name-canonical=true,push=true', env.REGISTRY, env.REPOSITORY, env.IMAGE_NAME) || 'type=docker' }}
          # push-by-digest rejects tags; the docker exporter needs one to give
          # Trivy something to reference.
          tags: ${{ !inputs.push && steps.meta.outputs.tags || '' }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # The local `docker` exporter rejects attestations.
          provenance: ${{ inputs.push && 'mode=max' || 'false' }}
          sbom: ${{ inputs.push }}
          build-args: |
            ${{ inputs.build-args }}

      # Scans the digest that was just pushed, not a rebuild of it. Nothing
      # consults GitHub check status at deploy time, so this failing is what
      # keeps the image untagged, unsigned and unattested - and therefore
      # undeployable under the Kyverno policy, which requires all three.
      #
      # ignore-unfixed: an unfixable finding in a base image cannot be actioned
      # here, and would block every release until upstream published a patch.
      - name: Scan image for vulnerabilities
        if: inputs.scan
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8 # v0.36.0
        env:
          TRIVY_USERNAME: ${{ env.REPOSITORY }}
          TRIVY_PASSWORD: ${{ secrets.DOCKERHUB_TOKEN }}
        with:
          image-ref: ${{ inputs.push && format('{0}/{1}/{2}@{3}', env.REGISTRY, env.REPOSITORY, env.IMAGE_NAME, steps.build-push.outputs.digest) || fromJSON(steps.meta.outputs.json).tags[0] }}
          severity: ${{ inputs.scan-severity }}
          ignore-unfixed: true
          exit-code: "1"
          format: table

      - name: Install Cosign
        if: inputs.push
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      # The attestations below are signed statements *about* the image; none of
      # them is a signature *on* the image, which is what the Kyverno policy's
      # verifyImageSignatures call looks for. Keyless, so the signing identity
      # is this workflow's OIDC token - the same identity that signs the
      # attestations, and the one the policy's subjectRegExp matches.
      #
      # This writes a sha256-<digest>.sig tag. No allowTags regexp in the
      # homelab ImageUpdater matches that shape, so it stays invisible to
      # deployment discovery.
      - name: Sign image
        if: inputs.push
        env:
          IMAGE_REF: ${{ env.REGISTRY }}/${{ env.REPOSITORY }}/${{ env.IMAGE_NAME }}
          DIGEST: ${{ steps.build-push.outputs.digest }}
        run: cosign sign --yes "${IMAGE_REF}@${DIGEST}"

      - name: Extract buildx-generated SBOM
        id: sbom-extract
        if: inputs.push
        run: |
          docker buildx imagetools inspect \
            ${{ env.REGISTRY }}/${{ env.REPOSITORY }}/${{ env.IMAGE_NAME }}@${{ steps.build-push.outputs.digest }} \
            --format '{{ json .SBOM.SPDX }}' > sbom.spdx.json

      - name: Attest SBOM
        uses: actions/attest@f7c74d28b9d84cb8768d0b8ca14a4bac6ef463e6 # v4.2.0
        if: inputs.push
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.REPOSITORY }}/${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.build-push.outputs.digest }}
          sbom-path: sbom.spdx.json
          push-to-registry: true

      - name: Attest Provenance
        uses: actions/attest@f7c74d28b9d84cb8768d0b8ca14a4bac6ef463e6 # v4.2.0
        if: inputs.push
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.REPOSITORY }}/${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.build-push.outputs.digest }}
          push-to-registry: true

      # Fails the job before any tag exists if the signature the cluster will
      # demand is not the one this workflow just wrote. The identity pattern
      # mirrors the subjectRegExp in the homelab ImageValidatingPolicy, so a
      # signature that would be rejected at admission is rejected here instead,
      # where it is a red check rather than a stuck rollout.
      - name: Verify signature
        if: inputs.push
        env:
          IMAGE_REF: ${{ env.REGISTRY }}/${{ env.REPOSITORY }}/${{ env.IMAGE_NAME }}
          DIGEST: ${{ steps.build-push.outputs.digest }}
          OWNER: ${{ github.repository_owner }}
        run: |-
          set -euo pipefail
          cosign verify \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            --certificate-identity-regexp "^https://github\.com/${OWNER}/.+/\.github/workflows/.+@.+$" \
            "${IMAGE_REF}@${DIGEST}" > /dev/null
          echo "Signature verified for ${IMAGE_REF}@${DIGEST}"

      # Only now does the image become discoverable, with its signature and
      # attestations already in place. `imagetools create` re-pushes the same
      # manifest under
      # each tag rather than wrapping it in a new index, so the digest is
      # unchanged and the attestations - attached to that digest - stay
      # findable. Verified against a scratch registry.
      - name: Publish tags
        if: inputs.push
        env:
          METADATA_JSON: ${{ steps.meta.outputs.json }}
          IMAGE_REF: ${{ env.REGISTRY }}/${{ env.REPOSITORY }}/${{ env.IMAGE_NAME }}
          DIGEST: ${{ steps.build-push.outputs.digest }}
        run: |-
          set -euo pipefail
          args=()
          while IFS= read -r tag; do
            args+=(--tag "$tag")
          done < <(jq -r '.tags[]' <<< "$METADATA_JSON")

          if [[ ${#args[@]} -eq 0 ]]; then
            echo "::error title=Publish tags::docker/metadata-action produced no tags"
            exit 1
          fi

          docker buildx imagetools create "${args[@]}" "${IMAGE_REF}@${DIGEST}"
          docker buildx imagetools inspect "${IMAGE_REF}@${DIGEST}" --format '{{ json .Manifest.Digest }}'
