name: Build and Push Docker Image

# Reusable workflow. The caller owns every registry detail.
# Read README.md before you change this file.
on:
  workflow_call:
    inputs:
      registry:
        description: "Registry host to publish to."
        required: true
        type: string
      image-name:
        description: "Repository path under the registry, namespace included. For example theadzik/zmuda-pro-blog."
        required: true
        type: string
      registry-username:
        description: "User to authenticate to the registry as."
        required: true
        type: string
      context-path:
        description: "Docker build context."
        required: false
        type: string
        default: "."
      git-ref:
        description: "Ref to check out. Empty means the ref that triggered the run."
        required: false
        type: string
        default: ""
      fetch-depth:
        description: "Checkout depth. 0 for full history (needed when the build reads .git)."
        required: false
        type: number
        default: 1
      tags:
        description: "docker/metadata-action tag spec, one per line."
        required: false
        type: string
        default: "type=raw,value=latest"
      build-args:
        description: "Docker build args, one KEY=value per line."
        required: false
        type: string
        default: ""
      platforms:
        description: "Comma-separated. Every platform is scanned. Anything other than linux/amd64 sets up QEMU, so a cross build can RUN."
        required: false
        type: string
        default: "linux/amd64"
      push:
        description: "Push and attest. False builds and scans only (pull requests)."
        required: false
        type: boolean
        default: true
      scan:
        description: "Fail on fixable findings. Only applies when push is false; the gate is push || scan."
        required: false
        type: boolean
        default: true
      extra-scan-severity:
        description: "Severities to fail on as well as HIGH and CRITICAL. UNKNOWN, LOW or MEDIUM, comma-separated."
        required: false
        type: string
        default: ""
      trivyignores:
        description: "Repo-relative path to a Trivy ignore file. One .trivyignore.yaml, or a comma-separated list of plain .trivyignore files."
        required: false
        type: string
        default: ""
      extra-registry:
        description: "Further registry to log in to, for base image pulls. Nothing is published there. Empty to skip."
        required: false
        type: string
        default: ""
      extra-registry-username:
        description: "User to authenticate to extra-registry as."
        required: false
        type: string
        default: ""
      timeout-minutes:
        required: false
        type: number
        default: 30
    secrets:
      REGISTRY_PASSWORD:
        description: "Password or token for registry-username."
        required: true
      EXTRA_REGISTRY_PASSWORD:
        description: "Password or token for extra-registry-username."
        required: false
    outputs:
      digest:
        description: "Digest of the image that was scanned, signed and tagged."
        value: ${{ jobs.build-push-sign.outputs.digest }}
      image-ref:
        description: "Image reference without a tag."
        value: ${{ jobs.build-push-sign.outputs.image-ref }}

env:
  IMAGE_REF: ${{ inputs.registry }}/${{ inputs.image-name }}

jobs:
  build-push-sign:
    # The caller must grant at least this set, or the run fails at startup.
    permissions:
      contents: read
      id-token: write
      attestations: write
      artifact-metadata: write
      packages: write
    runs-on: ubuntu-latest
    timeout-minutes: ${{ inputs.timeout-minutes }}
    outputs:
      digest: ${{ steps.layout.outputs.digest }}
      image-ref: ${{ env.IMAGE_REF }}
    steps:
      # HIGH,CRITICAL is a floor the caller cannot lower. First step, so a bad
      # value fails in seconds instead of after a full build.
      - name: Resolve scan severities
        id: severity
        env:
          EXTRA: ${{ inputs.extra-scan-severity }}
        run: |-
          set -euo pipefail
          severities="HIGH,CRITICAL"

          IFS=',' read -ra requested <<< "${EXTRA}"
          for raw in "${requested[@]}"; do
            token="${raw//[[:space:]]/}"
            [[ -z "${token}" ]] && continue
            token="${token^^}"
            case "${token}" in
              UNKNOWN | LOW | MEDIUM)
                [[ ",${severities}," == *",${token},"* ]] || severities="${severities},${token}"
                ;;
              HIGH | CRITICAL)
                echo "::error title=Scan severity::${token} always fails this build. extra-scan-severity adds severities below HIGH; it cannot restate the floor or remove it."
                exit 1
                ;;
              *)
                echo "::error title=Scan severity::'${raw}' is not a Trivy severity. extra-scan-severity takes UNKNOWN, LOW or MEDIUM."
                exit 1
                ;;
            esac
          done

          echo "severity=${severities}" >> "$GITHUB_OUTPUT"
          echo "Fixable findings at ${severities} fail this build."

      # Every platform is scanned, but the SBOM describes only the first.
      - name: Warn on multi-platform SBOM coverage
        if: contains(inputs.platforms, ',')
        env:
          PLATFORMS: ${{ inputs.platforms }}
        run: |-
          echo "::warning title=SBOM coverage::${PLATFORMS} produces a multi-platform index. Every platform is scanned, but the attested SBOM describes the first one only."

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.git-ref }}
          fetch-depth: ${{ inputs.fetch-depth }}
          # Keeps the checkout token out of .git/config, the build cache and any
          # layer built by a `COPY .`. Nothing here pushes via git.
          persist-credentials: false

      # A cross-platform RUN needs emulation. Skipped for a native-only build,
      # where it would cost time and do nothing.
      - name: Set up QEMU
        if: inputs.platforms != 'linux/amd64'
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Login to registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ inputs.registry }}
          username: ${{ inputs.registry-username }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      - name: Login to extra registry
        if: inputs.extra-registry != ''
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ inputs.extra-registry }}
          username: ${{ inputs.extra-registry-username }}
          password: ${{ secrets.EXTRA_REGISTRY_PASSWORD }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE_REF }}
          tags: ${{ inputs.tags }}

      # Exports to disk, not to the registry, so the scan runs before the push.
      # Do not set `sbom`: BuildKit writes SPDX, which Trivy reads as empty.
      - name: Build to OCI layout
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: ${{ inputs.context-path }}
          platforms: ${{ inputs.platforms }}
          outputs: type=oci,tar=false,dest=${{ runner.temp }}/layout,name=${{ env.IMAGE_REF }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: ${{ inputs.push && 'mode=max' || 'false' }}
          build-args: |
            ${{ inputs.build-args }}

      # index.json is the authority, not the action's digest output.
      - name: Read layout digest
        id: layout
        run: |-
          set -euo pipefail
          digest=$(jq -er '.manifests[0].digest' "${RUNNER_TEMP}/layout/index.json")
          echo "digest=${digest}" >> "$GITHUB_OUTPUT"
          echo "Built ${digest}"

      # Trivy finds trivy.yaml, .trivyignore and trivy-secret.yaml in the working
      # directory, which is the caller's repo. All three are pinned here instead.
      - name: Write the Trivy configuration
        if: inputs.push || inputs.scan
        env:
          TRIVYIGNORES: ${{ inputs.trivyignores }}
        run: |-
          set -euo pipefail

          # `disable-rules: []` and not an empty file: Trivy fails on a secret
          # config with no YAML node in it.
          : > "${RUNNER_TEMP}/empty.trivyignore"
          cat > "${RUNNER_TEMP}/trivy-secret.yaml" <<'EOF'
          disable-rules: []
          EOF

          # Resolve `trivyignores` against the caller's checkout. One YAML file,
          # or one or more plain files concatenated. Mixing the forms is refused.
          ignorefile="${RUNNER_TEMP}/empty.trivyignore"
          yaml=() plain=()
          IFS=',' read -ra requested <<< "${TRIVYIGNORES}"
          for raw in "${requested[@]}"; do
            path="${raw#"${raw%%[![:space:]]*}"}"
            path="${path%"${path##*[![:space:]]}"}"
            [[ -z "${path}" ]] && continue
            if [[ ! -f "${path}" ]]; then
              echo "::error title=trivyignores::${path} does not exist in the checked-out repository"
              exit 1
            fi
            case "${path}" in
              *.yaml | *.yml) yaml+=("${path}") ;;
              *) plain+=("${path}") ;;
            esac
          done

          if [[ ${#yaml[@]} -gt 0 && ${#plain[@]} -gt 0 ]]; then
            echo "::error title=trivyignores::cannot mix the YAML form with plain .trivyignore files"
            exit 1
          elif [[ ${#yaml[@]} -gt 1 ]]; then
            echo "::error title=trivyignores::only one .trivyignore.yaml is allowed, got ${#yaml[@]}"
            exit 1
          elif [[ ${#yaml[@]} -eq 1 ]]; then
            # Absolute, so the scan step does not depend on its working
            # directory matching this one.
            ignorefile=$(realpath "${yaml[0]}")
          elif [[ ${#plain[@]} -gt 0 ]]; then
            ignorefile="${RUNNER_TEMP}/combined.trivyignore"
            cat "${plain[@]}" > "${ignorefile}"
          fi

          # Echoed so a run that passed always shows which acceptances were in
          # force. `show-suppressed` below shows which of them actually fired.
          if [[ "${ignorefile}" != "${RUNNER_TEMP}/empty.trivyignore" ]]; then
            echo "Ignore file in force (${ignorefile}):"
            cat "${ignorefile}"
          else
            echo "No ignore file; every finding counts."
          fi

          cat > "${RUNNER_TEMP}/trivy.yaml" <<'EOF'
          # An EOL distro scans clean and exits 0 without this.
          exit-on-eol: 1

          # `table-mode` is not here: it is rejected unless the format is table,
          # and this file is also used to generate the CycloneDX SBOM.
          dependency-tree: true

          scan:
            show-suppressed: true
            # Written down so a Trivy release cannot drop either one silently.
            scanners:
              - vuln
              - secret

          db:
            # The progress bar only. `hide-progress` would drop the whole log.
            no-progress: true
          EOF

          # Appended, because the heredoc above is unexpanded on purpose.
          {
            printf '\n'
            printf 'ignorefile: %s\n' "${ignorefile}"
            printf 'secret:\n  config: %s\n' "${RUNNER_TEMP}/trivy-secret.yaml"
          } >> "${RUNNER_TEMP}/trivy.yaml"

          echo "Trivy configuration for this run:"
          cat "${RUNNER_TEMP}/trivy.yaml"

      # The CLI, not trivy-action: a `uses:` step cannot loop, and every
      # platform in the index has to be scanned separately.
      - name: Install Trivy
        if: inputs.push || inputs.scan
        uses: aquasecurity/setup-trivy@81e514348e19b6112ce2a7e3ecbafe19c1e1f567 # v0.3.1
        with:
          version: v0.74.0

      # `--platform` is accepted but silently ignored for `--input`, so each
      # platform is scanned with index.json rewritten to name only that one.
      - name: Scan every platform for vulnerabilities
        if: inputs.push || inputs.scan
        env:
          SEVERITY: ${{ steps.severity.outputs.severity }}
        run: |-
          set -euo pipefail
          layout="${RUNNER_TEMP}/layout"
          index="${layout}/index.json"

          scan() {
            trivy image \
              --config "${RUNNER_TEMP}/trivy.yaml" \
              --input "${layout}" \
              --severity "${SEVERITY}" \
              --ignore-unfixed \
              --exit-code 1 \
              --format table \
              --table-mode detailed
          }

          # No provenance leaves a manifest at the root; anything else an index.
          # `unknown/unknown` children are buildkit's attestation manifests.
          root_media=$(jq -r '.manifests[0].mediaType' "${index}")
          children='[]'
          if [[ "${root_media}" == "application/vnd.oci.image.index.v1+json" ]]; then
            root=$(jq -r '.manifests[0].digest' "${index}" | sed 's/^sha256://')
            children=$(jq -c '[.manifests[] | select((.platform.os // "unknown") != "unknown")]' \
              "${layout}/blobs/sha256/${root}")
          fi
          count=$(jq 'length' <<< "${children}")

          if [[ "${count}" -le 1 ]]; then
            echo "Single-platform layout."
            scan
            exit 0
          fi

          # Restored on any exit: the push reads this file back.
          cp "${index}" "${index}.orig"
          trap 'mv -f "${index}.orig" "${index}"' EXIT

          failed=()
          for i in $(seq 0 $((count - 1))); do
            manifest=$(jq -c ".[${i}]" <<< "${children}")
            platform=$(jq -r '[.platform.os, .platform.architecture, (.platform.variant // empty)] | join("/")' <<< "${manifest}")

            jq -n --argjson m "${manifest}" \
              '{schemaVersion: 2, mediaType: "application/vnd.oci.image.index.v1+json", manifests: [$m]}' \
              > "${index}"

            echo "::group::Scanning ${platform}"
            if scan; then
              echo "${platform}: clean"
            else
              echo "::error title=Scan::${platform} has findings at ${SEVERITY}"
              failed+=("${platform}")
            fi
            echo "::endgroup::"
          done

          if [[ ${#failed[@]} -gt 0 ]]; then
            echo "::error title=Scan::findings on ${#failed[@]} of ${count} platforms: ${failed[*]}"
            exit 1
          fi
          echo "All ${count} platforms scanned clean at ${SEVERITY}."

      # Pinned: 2.x and 3.x write the signature in different places.
      - name: Install Cosign
        if: inputs.push
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.1.3

      - name: Install oras
        if: inputs.push
        uses: oras-project/setup-oras@1d808f7d7f6995cc68b7bf507bfe5c5446e1dc9d # v2.0.1


      # No tag yet, so nothing can select the image until the tags go up last.
      # The digest is read back from the registry rather than trusted.
      - name: Push layout by digest
        if: inputs.push
        env:
          DIGEST: ${{ steps.layout.outputs.digest }}
        run: |-
          set -euo pipefail
          oras cp --from-oci-layout \
            "${RUNNER_TEMP}/layout@${DIGEST}" \
            "${IMAGE_REF}@${DIGEST}"

          published=$(oras manifest fetch --descriptor "${IMAGE_REF}@${DIGEST}" | jq -er .digest)
          if [[ "$published" != "$DIGEST" ]]; then
            echo "::error title=Push::registry returned ${published}, expected ${DIGEST}"
            exit 1
          fi

      # A signature *on* the image; an attestation is not a substitute.
      # `--recursive` signs every child, not only the index.
      - name: Sign image
        if: inputs.push
        env:
          DIGEST: ${{ steps.layout.outputs.digest }}
        run: cosign sign --yes --recursive "${IMAGE_REF}@${DIGEST}"

      # CycloneDX, from the same layout and the same binary that gated the
      # build. Describes the first platform in the index.
      - name: Generate SBOM from the layout
        if: inputs.push
        run: |-
          set -euo pipefail
          trivy image \
            --config "${RUNNER_TEMP}/trivy.yaml" \
            --input "${RUNNER_TEMP}/layout" \
            --format cyclonedx \
            --output sbom.cdx.json

          os=$(jq -r '[.components[]? | select(.type=="operating-system") | .name] | join(",")' sbom.cdx.json)
          if [[ -z "${os}" ]]; then
            echo "::error title=SBOM::no operating-system component; readers cannot match OS packages"
            exit 1
          fi
          echo "SBOM: $(jq '.components|length' sbom.cdx.json) components, OS ${os}"

      # actions/attest sets the predicate type itself. The Kyverno policy in
      # homelab matches https://cyclonedx.org/bom exactly.
      - name: Attest SBOM
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        if: inputs.push
        with:
          subject-name: ${{ env.IMAGE_REF }}
          subject-digest: ${{ steps.layout.outputs.digest }}
          sbom-path: sbom.cdx.json
          push-to-registry: true

      - name: Attest Provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        if: inputs.push
        with:
          subject-name: ${{ env.IMAGE_REF }}
          subject-digest: ${{ steps.layout.outputs.digest }}
          push-to-registry: true

      # Checks the index and every child, because `--recursive` signed them all.
      # A child that failed to sign would otherwise surface at admission.
      - name: Verify signatures
        if: inputs.push
        env:
          DIGEST: ${{ steps.layout.outputs.digest }}
          # The identity is this file's own path. If you rename or move this
          # workflow, change this line with it or every build fails here.
          SIGNER_IDENTITY: '^https://github\.com/theadzik/github-workflows/\.github/workflows/build-and-push\.yaml@.+$'
        run: |-
          set -euo pipefail
          index="${RUNNER_TEMP}/layout/index.json"

          digests=("${DIGEST}")
          if [[ "$(jq -r '.manifests[0].mediaType' "${index}")" == "application/vnd.oci.image.index.v1+json" ]]; then
            root=$(jq -r '.manifests[0].digest' "${index}" | sed 's/^sha256://')
            # Command substitution, not `< <(...)`: a process substitution that
            # fails here would leave the children unverified and still exit 0.
            children=$(jq -r '.manifests[].digest' "${RUNNER_TEMP}/layout/blobs/sha256/${root}")
            while read -r child; do
              [[ -n "${child}" ]] && digests+=("${child}")
            done <<< "${children}"
          fi

          for digest in "${digests[@]}"; do
            cosign verify \
              --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
              --certificate-identity-regexp "${SIGNER_IDENTITY}" \
              "${IMAGE_REF}@${digest}" > /dev/null
            echo "Verified ${IMAGE_REF}@${digest}"
          done
          echo "Verified ${#digests[@]} signature(s)."

      # Both attestations, read back from the registry. A malformed or missing
      # one would otherwise be found by the cluster instead of by this build.
      - name: Verify attestations
        if: inputs.push
        env:
          DIGEST: ${{ steps.layout.outputs.digest }}
          SIGNER_IDENTITY: '^https://github\.com/theadzik/github-workflows/\.github/workflows/build-and-push\.yaml@.+$'
        run: |-
          set -euo pipefail
          # cosign shorthands: https://cyclonedx.org/bom and
          # https://slsa.dev/provenance/v1, the types actions/attest sets.
          for type in cyclonedx slsaprovenance1; do
            cosign verify-attestation \
              --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
              --certificate-identity-regexp "${SIGNER_IDENTITY}" \
              --type "${type}" \
              "${IMAGE_REF}@${DIGEST}" > /dev/null
            echo "Verified ${type} attestation on ${IMAGE_REF}@${DIGEST}"
          done

      # Last, so the image becomes discoverable only once it is signed.
      # `imagetools create` keeps the digest, so the referrers stay findable.
      - name: Publish tags
        if: inputs.push
        env:
          METADATA_JSON: ${{ steps.meta.outputs.json }}
          DIGEST: ${{ steps.layout.outputs.digest }}
        run: |-
          set -euo pipefail
          args=()
          while IFS= read -r tag; do
            args+=(--tag "$tag")
          done < <(jq -r '.tags[]' <<< "$METADATA_JSON")

          if [[ ${#args[@]} -eq 0 ]]; then
            echo "::error title=Publish tags::docker/metadata-action produced no tags"
            exit 1
          fi

          docker buildx imagetools create "${args[@]}" "${IMAGE_REF}@${DIGEST}"
          docker buildx imagetools inspect "${IMAGE_REF}@${DIGEST}" --format '{{ json .Manifest.Digest }}'
