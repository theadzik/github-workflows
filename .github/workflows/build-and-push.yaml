name: Build and Push Docker Image

# Shared reusable workflow. Callers:
#   uses: theadzik/github-workflows/.github/workflows/build-and-push.yaml@<sha>
#   secrets: inherit   # supplies DOCKERHUB_TOKEN
on:
  workflow_call:
    inputs:
      image-name:
        description: "Image repository name, appended to <registry>/<username>/."
        required: true
        type: string
      context-path:
        description: "Docker build context."
        required: false
        type: string
        default: "."
      git-ref:
        description: "Ref to check out. Empty means the ref that triggered the run."
        required: false
        type: string
        default: ""
      fetch-depth:
        description: "Checkout depth. 0 for full history (needed when the build reads .git)."
        required: false
        type: number
        default: 1
      tags:
        description: "docker/metadata-action tag spec, one per line."
        required: false
        type: string
        default: "type=raw,value=latest"
      build-args:
        description: "Docker build args, one KEY=value per line."
        required: false
        type: string
        default: ""
      platforms:
        description: "Multi-platform is allowed, but Trivy scans only one platform of the index."
        required: false
        type: string
        default: "linux/amd64"
      push:
        description: "Push and attest. False builds and scans only (pull requests)."
        required: false
        type: boolean
        default: true
      scan:
        description: "Fail the build on fixable HIGH/CRITICAL findings before anything is published."
        required: false
        type: boolean
        default: true
      scan-severity:
        required: false
        type: string
        default: "HIGH,CRITICAL"
      registry:
        required: false
        type: string
        default: "docker.io"
      registry-username:
        description: "Defaults to the caller repository's DOCKERHUB_USERNAME variable."
        required: false
        type: string
        default: ""
      extra-registry:
        description: "Second registry to authenticate against with the same credentials. Empty to skip."
        required: false
        type: string
        default: "dhi.io"
      timeout-minutes:
        required: false
        type: number
        default: 30
    secrets:
      DOCKERHUB_TOKEN:
        required: true
    outputs:
      digest:
        description: "Digest of the image that was scanned, signed and tagged."
        value: ${{ jobs.build-push-sign.outputs.digest }}
      image-ref:
        description: "Image reference without a tag, for example docker.io/user/name."
        value: ${{ jobs.build-push-sign.outputs.image-ref }}

env:
  REGISTRY: ${{ inputs.registry }}
  REPOSITORY: ${{ inputs.registry-username != '' && inputs.registry-username || vars.DOCKERHUB_USERNAME }}
  IMAGE_NAME: ${{ inputs.image-name }}

jobs:
  build-push-sign:
    permissions:
      contents: read
      id-token: write
      attestations: write
      artifact-metadata: write
    runs-on: ubuntu-latest
    timeout-minutes: ${{ inputs.timeout-minutes }}
    outputs:
      digest: ${{ steps.layout.outputs.digest }}
      image-ref: ${{ env.REGISTRY }}/${{ env.REPOSITORY }}/${{ env.IMAGE_NAME }}
    steps:
      # Trivy scans one platform out of a multi-platform index, so the platforms
      # beyond the first are signed without having been scanned. Accepted
      # deliberately rather than blocked, but it should be visible in the log of
      # any build that opts into it.
      - name: Warn on multi-platform scan coverage
        if: contains(inputs.platforms, ',')
        env:
          PLATFORMS: ${{ inputs.platforms }}
        run: |-
          echo "::warning title=Scan coverage::${PLATFORMS} produces a multi-platform index. Trivy scans one platform; the others are signed unscanned."

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.git-ref }}
          fetch-depth: ${{ inputs.fetch-depth }}
          # Otherwise checkout writes an x-access-token auth header into
          # .git/config. A `COPY .` would bake that token into a builder layer,
          # and `cache-to: type=gha,mode=max` would export it to the Actions
          # cache, where it outlives the job. Nothing here pushes via git.
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      # Both logins run even on build-only pull requests: authenticated pulls
      # lift the anonymous Docker Hub rate limit, and dhi.io issues no
      # anonymous pull tokens at all. One Docker account backs both.
      - name: Login to registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ env.REPOSITORY }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Login to extra registry
        if: inputs.extra-registry != ''
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ inputs.extra-registry }}
          username: ${{ env.REPOSITORY }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.REPOSITORY }}/${{ env.IMAGE_NAME }}
          tags: ${{ inputs.tags }}

      # One build, one artifact, exported to an OCI layout on disk rather than
      # straight into the registry. Everything downstream - the scan, the push,
      # the signature, the attestations - references the digest this produces,
      # so the bytes that were scanned are the bytes that get signed and
      # deployed. The same exporter serves both paths: a build-only run simply
      # never pushes what it built.
      #
      # The layout already contains the SBOM and provenance attestation
      # manifests, so the push below carries them rather than regenerating them.
      - name: Build to OCI layout
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: ${{ inputs.context-path }}
          platforms: ${{ inputs.platforms }}
          outputs: type=oci,tar=false,dest=${{ runner.temp }}/layout,name=${{ env.REGISTRY }}/${{ env.REPOSITORY }}/${{ env.IMAGE_NAME }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: ${{ inputs.push && 'mode=max' || 'false' }}
          sbom: ${{ inputs.push }}
          build-args: |
            ${{ inputs.build-args }}

      # index.json is the authority, not the action's digest output: this is the
      # digest that will exist in the registry, byte for byte.
      - name: Read layout digest
        id: layout
        run: |-
          set -euo pipefail
          digest=$(jq -er '.manifests[0].digest' "${RUNNER_TEMP}/layout/index.json")
          echo "digest=${digest}" >> "$GITHUB_OUTPUT"
          echo "Built ${digest}"

      # Scans the layout on disk, before anything has been pushed, so a finding
      # keeps the image out of the registry entirely rather than leaving an
      # orphan digest behind.
      #
      # `input` accepts an OCI layout directory even though it is documented as
      # a tar file: the action exports it as TRIVY_INPUT and runs `trivy image .`,
      # where TRIVY_INPUT wins over the positional argument. Do not add
      # `image-ref` here - it is the one input that replaces that dot, which
      # would leave the command with two competing targets.
      #
      # ignore-unfixed: an unfixable finding in a base image cannot be actioned
      # here, and would block every release until upstream published a patch.
      - name: Scan image for vulnerabilities
        if: inputs.scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          input: ${{ runner.temp }}/layout
          severity: ${{ inputs.scan-severity }}
          ignore-unfixed: true
          exit-code: "1"
          format: table

      # Installed before regctl on purpose: the regctl installer verifies its
      # download with `cosign verify-blob` against regclient's release identity,
      # but only when cosign is already on PATH - otherwise it logs that
      # metadata is unavailable and installs an unverified binary. Reordering
      # these two steps silently drops that check.
      #
      # Pinned rather than left to the installer's default: cosign 3.x writes a
      # Sigstore bundle to the sha256-<digest> tag, where 2.x wrote a classic
      # simple-signing sha256-<digest>.sig, and which of those Kyverno accepts
      # is not something to discover through a silent installer bump.
      - name: Install Cosign
        if: inputs.push
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.0.6

      # `docker buildx imagetools create` refuses to push without --tag and
      # skopeo rejects a digest destination, so reproducing what the buildkit
      # push-by-digest exporter did takes regctl.
      - name: Install regctl
        if: inputs.push
        uses: regclient/actions/regctl-installer@1b705e32d40851370799ea5814e83d0a5f6a70dc # v0.1.0
        with:
          release: v0.11.5

      # Pushed at its digest with no tag written, so ArgoCD Image Updater - which
      # discovers images by listing tags - cannot see it until the tags go up
      # last, after the signature and attestations exist. regctl reuses the
      # credentials docker/login-action wrote to ~/.docker/config.json.
      - name: Push layout by digest
        if: inputs.push
        env:
          IMAGE_REF: ${{ env.REGISTRY }}/${{ env.REPOSITORY }}/${{ env.IMAGE_NAME }}
          DIGEST: ${{ steps.layout.outputs.digest }}
        run: |-
          set -euo pipefail
          regctl image copy \
            "ocidir://${RUNNER_TEMP}/layout@${DIGEST}" \
            "${IMAGE_REF}@${DIGEST}"

          published=$(regctl manifest head "${IMAGE_REF}@${DIGEST}")
          if [[ "$published" != "$DIGEST" ]]; then
            echo "::error title=Push::registry returned ${published}, expected ${DIGEST}"
            exit 1
          fi

      # The attestations below are signed statements *about* the image; none of
      # them is a signature *on* the image, which is what the Kyverno policy's
      # verifyImageSignatures call looks for. Keyless, so the signing identity
      # is this workflow's OIDC token - the same identity that signs the
      # attestations, and the one the policy's subjectRegExp matches.
      #
      # cosign 3.x writes a Sigstore bundle to a sha256-<digest> tag (2.x wrote
      # sha256-<digest>.sig). No allowTags regexp in the homelab ImageUpdater
      # matches either shape, so it stays invisible to deployment discovery.
      #
      # The bearer token is minted here rather than left to cosign. Neither the
      # ambient docker login nor --registry-username/--registry-password got
      # cosign an authenticated pull of the manifest it signs: both runs ended
      # in Docker Hub's unauthenticated rate limit, after the push had already
      # happened.
      #
      # Why that failed silently: for a public repository, Docker Hub's token
      # endpoint answers a pull-scope request with HTTP 200 and an *anonymous*
      # token even when credentials are absent or rejected. cosign sees a valid
      # token and no auth error, and the problem only surfaces later as a rate
      # limit. Minting the token with `curl -f -u` turns that into a loud 401
      # on the credentials themselves.
      - name: Sign image
        if: inputs.push
        env:
          IMAGE_REF: ${{ env.REGISTRY }}/${{ env.REPOSITORY }}/${{ env.IMAGE_NAME }}
          DIGEST: ${{ steps.layout.outputs.digest }}
          REPO_PATH: ${{ env.REPOSITORY }}/${{ env.IMAGE_NAME }}
          REGISTRY_USERNAME: ${{ env.REPOSITORY }}
          REGISTRY_PASSWORD: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |-
          set -euo pipefail
          # push scope as well as pull: cosign writes the signature back to the
          # same repository.
          token=$(curl -fsSL -u "${REGISTRY_USERNAME}:${REGISTRY_PASSWORD}" \
            "https://auth.docker.io/token?service=registry.docker.io&scope=repository:${REPO_PATH}:pull,push" \
            | jq -er .token)
          cosign sign --yes --registry-token "${token}" "${IMAGE_REF}@${DIGEST}"

      - name: Extract buildx-generated SBOM
        id: sbom-extract
        if: inputs.push
        run: |
          docker buildx imagetools inspect \
            ${{ env.REGISTRY }}/${{ env.REPOSITORY }}/${{ env.IMAGE_NAME }}@${{ steps.layout.outputs.digest }} \
            --format '{{ json .SBOM.SPDX }}' > sbom.spdx.json

      - name: Attest SBOM
        uses: actions/attest@508db95dd578ae2727ebd6217d5ba78e4fbda05d # v4.2.1
        if: inputs.push
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.REPOSITORY }}/${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.layout.outputs.digest }}
          sbom-path: sbom.spdx.json
          push-to-registry: true

      - name: Attest Provenance
        uses: actions/attest@508db95dd578ae2727ebd6217d5ba78e4fbda05d # v4.2.1
        if: inputs.push
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.REPOSITORY }}/${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.layout.outputs.digest }}
          push-to-registry: true

      # Fails the job before any tag exists if the signature the cluster will
      # demand is not the one this workflow just wrote. The identity pattern
      # mirrors the subjectRegExp in the homelab ImageValidatingPolicy, so a
      # signature that would be rejected at admission is rejected here instead,
      # where it is a red check rather than a stuck rollout.
      - name: Verify signature
        if: inputs.push
        env:
          IMAGE_REF: ${{ env.REGISTRY }}/${{ env.REPOSITORY }}/${{ env.IMAGE_NAME }}
          DIGEST: ${{ steps.layout.outputs.digest }}
          OWNER: ${{ github.repository_owner }}
          REPO_PATH: ${{ env.REPOSITORY }}/${{ env.IMAGE_NAME }}
          REGISTRY_USERNAME: ${{ env.REPOSITORY }}
          REGISTRY_PASSWORD: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |-
          set -euo pipefail
          # Minted fresh rather than reused from the signing step: these tokens
          # last about five minutes and the attestations run in between.
          token=$(curl -fsSL -u "${REGISTRY_USERNAME}:${REGISTRY_PASSWORD}" \
            "https://auth.docker.io/token?service=registry.docker.io&scope=repository:${REPO_PATH}:pull" \
            | jq -er .token)
          cosign verify \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            --certificate-identity-regexp "^https://github\.com/${OWNER}/.+/\.github/workflows/.+@.+$" \
            --registry-token "${token}" \
            "${IMAGE_REF}@${DIGEST}" > /dev/null
          echo "Signature verified for ${IMAGE_REF}@${DIGEST}"

      # Only now does the image become discoverable, with its signature and
      # attestations already in place. `imagetools create` re-pushes the same
      # manifest under
      # each tag rather than wrapping it in a new index, so the digest is
      # unchanged and the attestations - attached to that digest - stay
      # findable. Verified against a scratch registry.
      - name: Publish tags
        if: inputs.push
        env:
          METADATA_JSON: ${{ steps.meta.outputs.json }}
          IMAGE_REF: ${{ env.REGISTRY }}/${{ env.REPOSITORY }}/${{ env.IMAGE_NAME }}
          DIGEST: ${{ steps.layout.outputs.digest }}
        run: |-
          set -euo pipefail
          args=()
          while IFS= read -r tag; do
            args+=(--tag "$tag")
          done < <(jq -r '.tags[]' <<< "$METADATA_JSON")

          if [[ ${#args[@]} -eq 0 ]]; then
            echo "::error title=Publish tags::docker/metadata-action produced no tags"
            exit 1
          fi

          docker buildx imagetools create "${args[@]}" "${IMAGE_REF}@${DIGEST}"
          docker buildx imagetools inspect "${IMAGE_REF}@${DIGEST}" --format '{{ json .Manifest.Digest }}'
