name: Build and Push Docker Image

# Shared reusable workflow. The caller owns every registry detail: where to
# publish, who to authenticate as, and which credential to use.
on:
  workflow_call:
    inputs:
      registry:
        description: "Registry host to publish to."
        required: true
        type: string
      image-name:
        description: "Repository path under the registry, namespace included. For example theadzik/zmuda-pro-blog."
        required: true
        type: string
      registry-username:
        description: "User to authenticate to the registry as."
        required: true
        type: string
      context-path:
        description: "Docker build context."
        required: false
        type: string
        default: "."
      git-ref:
        description: "Ref to check out. Empty means the ref that triggered the run."
        required: false
        type: string
        default: ""
      fetch-depth:
        description: "Checkout depth. 0 for full history (needed when the build reads .git)."
        required: false
        type: number
        default: 1
      tags:
        description: "docker/metadata-action tag spec, one per line."
        required: false
        type: string
        default: "type=raw,value=latest"
      build-args:
        description: "Docker build args, one KEY=value per line."
        required: false
        type: string
        default: ""
      platforms:
        description: "Multi-platform is allowed, but Trivy scans only one platform of the index."
        required: false
        type: string
        default: "linux/amd64"
      push:
        description: "Push and attest. False builds and scans only (pull requests)."
        required: false
        type: boolean
        default: true
      scan:
        description: "Fail the build on fixable HIGH/CRITICAL findings before anything is published."
        required: false
        type: boolean
        default: true
      scan-severity:
        required: false
        type: string
        default: "HIGH,CRITICAL"
      extra-registry:
        description: "Further registry to log in to, for base image pulls. Nothing is published there. Empty to skip."
        required: false
        type: string
        default: ""
      extra-registry-username:
        description: "User to authenticate to extra-registry as."
        required: false
        type: string
        default: ""
      timeout-minutes:
        required: false
        type: number
        default: 30
    secrets:
      REGISTRY_PASSWORD:
        description: "Password or token for registry-username."
        required: true
      EXTRA_REGISTRY_PASSWORD:
        description: "Password or token for extra-registry-username."
        required: false
    outputs:
      digest:
        description: "Digest of the image that was scanned, signed and tagged."
        value: ${{ jobs.build-push-sign.outputs.digest }}
      image-ref:
        description: "Image reference without a tag."
        value: ${{ jobs.build-push-sign.outputs.image-ref }}

env:
  IMAGE_REF: ${{ inputs.registry }}/${{ inputs.image-name }}

jobs:
  build-push-sign:
    # Callers must grant at least this set: a called workflow cannot hold more
    # than its caller, and asking for more fails the run at startup.
    # packages: write is what a registry authenticating with the job token
    # needs; it is inert for any other registry.
    permissions:
      contents: read
      id-token: write
      attestations: write
      artifact-metadata: write
      packages: write
    runs-on: ubuntu-latest
    timeout-minutes: ${{ inputs.timeout-minutes }}
    outputs:
      digest: ${{ steps.layout.outputs.digest }}
      image-ref: ${{ env.IMAGE_REF }}
    steps:
      # Trivy scans one platform out of a multi-platform index, so the platforms
      # beyond the first are signed without having been scanned. Accepted
      # deliberately rather than blocked, but it should be visible in the log of
      # any build that opts into it.
      - name: Warn on multi-platform scan coverage
        if: contains(inputs.platforms, ',')
        env:
          PLATFORMS: ${{ inputs.platforms }}
        run: |-
          echo "::warning title=Scan coverage::${PLATFORMS} produces a multi-platform index. Trivy scans one platform; the others are signed unscanned."

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.git-ref }}
          fetch-depth: ${{ inputs.fetch-depth }}
          # Otherwise checkout writes an x-access-token auth header into
          # .git/config. A `COPY .` would bake that token into a builder layer,
          # and `cache-to: type=gha,mode=max` would export it to the Actions
          # cache, where it outlives the job. Nothing here pushes via git.
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Login to registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ inputs.registry }}
          username: ${{ inputs.registry-username }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      # Pull-only, and its credentials are separate from the publishing
      # registry's. Runs on build-only pull requests too, since base images are
      # needed whether or not anything is published.
      - name: Login to extra registry
        if: inputs.extra-registry != ''
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ inputs.extra-registry }}
          username: ${{ inputs.extra-registry-username }}
          password: ${{ secrets.EXTRA_REGISTRY_PASSWORD }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE_REF }}
          tags: ${{ inputs.tags }}

      # One build, one artifact, exported to an OCI layout on disk rather than
      # straight into the registry. Everything downstream - the scan, the push,
      # the signature, the attestations - references the digest this produces,
      # so the bytes that were scanned are the bytes that get signed and
      # deployed. The same exporter serves both paths: a build-only run simply
      # never pushes what it built.
      #
      # The layout already contains the SBOM and provenance attestation
      # manifests, so the push below carries them rather than regenerating them.
      - name: Build to OCI layout
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: ${{ inputs.context-path }}
          platforms: ${{ inputs.platforms }}
          outputs: type=oci,tar=false,dest=${{ runner.temp }}/layout,name=${{ env.IMAGE_REF }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: ${{ inputs.push && 'mode=max' || 'false' }}
          sbom: ${{ inputs.push }}
          build-args: |
            ${{ inputs.build-args }}

      # index.json is the authority, not the action's digest output: this is the
      # digest that will exist in the registry, byte for byte.
      - name: Read layout digest
        id: layout
        run: |-
          set -euo pipefail
          digest=$(jq -er '.manifests[0].digest' "${RUNNER_TEMP}/layout/index.json")
          echo "digest=${digest}" >> "$GITHUB_OUTPUT"
          echo "Built ${digest}"

      # Scans the layout on disk, before anything is pushed, so a finding keeps
      # the image out of the registry rather than leaving an orphan digest.
      #
      # `input` takes an OCI layout directory despite being documented as a tar
      # file. Do not add `image-ref`: the action runs `trivy image .` with the
      # target passed as TRIVY_INPUT, and `image-ref` replaces that dot, leaving
      # two competing targets.
      #
      # ignore-unfixed: an unfixable base-image finding cannot be actioned here
      # and would block every release until upstream patched it.
      - name: Scan image for vulnerabilities
        if: inputs.scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          input: ${{ runner.temp }}/layout
          severity: ${{ inputs.scan-severity }}
          ignore-unfixed: true
          exit-code: "1"
          format: table

      # Installed before regctl on purpose: regctl's installer verifies its
      # download with `cosign verify-blob`, but only when cosign is already on
      # PATH - otherwise it installs an unverified binary. Reordering these two
      # steps silently drops that check.
      #
      # The version is pinned because 3.x and 2.x write the signature in
      # different places, and which one Kyverno accepts should not change under
      # an installer default.
      - name: Install Cosign
        if: inputs.push
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.1.2

      # `docker buildx imagetools create` refuses to push without --tag and
      # skopeo rejects a digest destination, so reproducing what the buildkit
      # push-by-digest exporter did takes regctl.
      - name: Install regctl
        if: inputs.push
        uses: regclient/actions/regctl-installer@1b705e32d40851370799ea5814e83d0a5f6a70dc # v0.1.0
        with:
          release: v0.11.5

      # Pushed at its digest with no tag written, so ArgoCD Image Updater - which
      # discovers images by listing tags - cannot see it until the tags go up
      # last, after the signature and attestations exist. regctl reuses the
      # credentials docker/login-action wrote to ~/.docker/config.json.
      - name: Push layout by digest
        if: inputs.push
        env:
          DIGEST: ${{ steps.layout.outputs.digest }}
        run: |-
          set -euo pipefail
          regctl image copy \
            "ocidir://${RUNNER_TEMP}/layout@${DIGEST}" \
            "${IMAGE_REF}@${DIGEST}"

          published=$(regctl manifest head "${IMAGE_REF}@${DIGEST}")
          if [[ "$published" != "$DIGEST" ]]; then
            echo "::error title=Push::registry returned ${published}, expected ${DIGEST}"
            exit 1
          fi

      # A signature *on* the image, which is what the Kyverno policy's
      # verifyImageSignatures call looks for; the attestations below are signed
      # statements *about* it. Keyless, so the signing identity is this
      # workflow's OIDC token - the same one that signs the attestations, and
      # the one the policy's subjectRegExp matches.
      #
      # cosign reads the credentials docker/login-action wrote to
      # ~/.docker/config.json.
      - name: Sign image
        if: inputs.push
        env:
          DIGEST: ${{ steps.layout.outputs.digest }}
        run: cosign sign --yes "${IMAGE_REF}@${DIGEST}"

      - name: Extract buildx-generated SBOM
        id: sbom-extract
        if: inputs.push
        run: |
          docker buildx imagetools inspect \
            ${{ env.IMAGE_REF }}@${{ steps.layout.outputs.digest }} \
            --format '{{ json .SBOM.SPDX }}' > sbom.spdx.json

      - name: Attest SBOM
        uses: actions/attest@508db95dd578ae2727ebd6217d5ba78e4fbda05d # v4.2.1
        if: inputs.push
        with:
          subject-name: ${{ env.IMAGE_REF }}
          subject-digest: ${{ steps.layout.outputs.digest }}
          sbom-path: sbom.spdx.json
          push-to-registry: true

      - name: Attest Provenance
        uses: actions/attest@508db95dd578ae2727ebd6217d5ba78e4fbda05d # v4.2.1
        if: inputs.push
        with:
          subject-name: ${{ env.IMAGE_REF }}
          subject-digest: ${{ steps.layout.outputs.digest }}
          push-to-registry: true

      # Fails the job before any tag exists if the signature the cluster will
      # demand is not the one this workflow just wrote. The identity pattern
      # mirrors the subjectRegExp in the homelab ImageValidatingPolicy, so a
      # signature that would be rejected at admission is rejected here instead,
      # where it is a red check rather than a stuck rollout.
      - name: Verify signature
        if: inputs.push
        env:
          DIGEST: ${{ steps.layout.outputs.digest }}
          OWNER: ${{ github.repository_owner }}
        run: |-
          set -euo pipefail
          cosign verify \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            --certificate-identity-regexp "^https://github\.com/${OWNER}/.+/\.github/workflows/.+@.+$" \
            "${IMAGE_REF}@${DIGEST}" > /dev/null
          echo "Signature verified for ${IMAGE_REF}@${DIGEST}"

      # Only now does the image become discoverable, with its signature and
      # attestations already in place. `imagetools create` re-pushes the same
      # manifest under each tag rather than wrapping it in a new index, so the
      # digest is unchanged and the referrers attached to it stay findable.
      - name: Publish tags
        if: inputs.push
        env:
          METADATA_JSON: ${{ steps.meta.outputs.json }}
          DIGEST: ${{ steps.layout.outputs.digest }}
        run: |-
          set -euo pipefail
          args=()
          while IFS= read -r tag; do
            args+=(--tag "$tag")
          done < <(jq -r '.tags[]' <<< "$METADATA_JSON")

          if [[ ${#args[@]} -eq 0 ]]; then
            echo "::error title=Publish tags::docker/metadata-action produced no tags"
            exit 1
          fi

          docker buildx imagetools create "${args[@]}" "${IMAGE_REF}@${DIGEST}"
          docker buildx imagetools inspect "${IMAGE_REF}@${DIGEST}" --format '{{ json .Manifest.Digest }}'
