version: 2

# Only dhi.io. Every base image in this repository is a test fixture, and since
# they moved off Docker Hub nothing here resolves against it.
registries:
  dhi-io:
    type: docker-registry
    url: https://dhi.io
    username: ${{ secrets.DOCKERHUB_USERNAME }}
    password: ${{ secrets.DOCKERHUB_TOKEN }}

updates:
  # The actions pinned inside the reusable workflows here are what every caller
  # repository ends up running, so they are updated in this repository and reach
  # callers through a new release tag.
  - package-ecosystem: "github-actions"
    directories:
      - "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    groups:
      # Majors stay out of the batch deliberately. A breaking change in an
      # action that builds, scans or signs every image needs to be reviewable
      # and revertable on its own, not merged alongside six routine bumps.
      github-actions:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  # actionlint and zizmor judge every edit before test-build-and-push.yaml gets
  # to run it. That workflow does run on these pull requests, so a bump to an
  # action this file pins is built, scanned, signed and attested for real before
  # it is merged.
  - package-ecosystem: "pre-commit"
    directories:
      - "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    groups:
      pre-commit:
        patterns:
          - "*"

  - package-ecosystem: "docker"
    directories:
      - "/tests/fixtures/*"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    registries:
      - dhi-io
    groups:
      fixtures:
        patterns:
          - "*"
